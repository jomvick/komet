[package]
name = "komet-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
komet-doc.workspace = true
loro.workspace = true
loro-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[features]
# In-process registry server speaking the DO's JSON WS protocol — test
# infrastructure for this crate's tests and komet-engine's integration tests.
mock-server = []

# Uses `registry::mock_server` (feature `mock-server`), so it must not be built
# without the feature: integration tests are separate crates, `cfg(test)` is not
# set on the library they link, and the import used to fail `cargo test -p
# komet-sync` with E0432. `cargo test --workspace` still runs it, because
# komet-engine's dev-dependency enables the feature.
[[test]]
name = "registry_client"
required-features = ["mock-server"]

[dev-dependencies]
chrono.workspace = true
# chat2_live example only (live checkpoint fetch against a deployed worker).
reqwest.workspace = true
komet-proto.workspace = true
tempfile.workspace = true
# `start_paused` virtual-clock tests (the 2026-07-30 sync-stall regressions).
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
