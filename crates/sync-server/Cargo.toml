[package]
name = "komet-sync-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
komet-doc.workspace = true
# The chat2 wire codec is the client's: one implementation, so the server's
# relay and an engine's ChatClient cannot drift apart.
komet-sync.workspace = true
# The device-room frame codec is the client's: one implementation, so the server's
# relay and a controller's link cannot drift apart.
komet-rpc.workspace = true
base64 = "0.22"
tokio.workspace = true
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
rusqlite.workspace = true
uuid = { workspace = true, features = ["v4"] }
sha2.workspace = true
futures-util = "0.3"

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-trait.workspace = true
tokio-tungstenite.workspace = true
