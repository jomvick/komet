services:
  komet-sync:
    build:
      context: .
      dockerfile: crates/sync-server/Dockerfile
    ports: ["8787:8787"]
    volumes: ["./data-sync:/data"]
    environment:
      # Required: compose stops with an error when it is not set.
      KOMET_SYNC_TOKEN: ${KOMET_SYNC_TOKEN:?set KOMET_SYNC_TOKEN (komet sync-init prints one)}
      KOMET_SYNC_PORT: 8787
    restart: unless-stopped
