name: release

# Build release artifacts and publish them as assets of the GitHub Release:
#   - Linux tarballs (x86_64 + aarch64) via scripts/package-linux.sh
#   - Linux AppImage via scripts/package-appimage.sh
#   - Linux .deb via scripts/package-deb.sh
#   - Linux .rpm via scripts/package-rpm.sh
#   - macOS dmg (Apple silicon) via scripts/package-macos.sh
#   - Windows zip + exe via scripts/package-windows.sh
# plus a manifest.json (version + per-artifact sha256) signed with the
# release key (manifest.json.sig). The auto-updater (crates/update) and
# install.sh only install files listed in a correctly signed manifest.
#
# Release signing (see docs/release-signing.md):
#   vars.KOMET_RELEASE_PUBLIC_KEY  hex Ed25519 public key, compiled into the
#     binaries so they can verify updates. Required for tag builds.
#   secrets.RELEASE_SIGNING_KEY    PEM Ed25519 private key, used only by the
#     publish job's signing step.
#   vars.KOMET_RELEASE_SIGNING_PUBLIC_KEY  optional, only during a key
#     rotation: the public key of RELEASE_SIGNING_KEY when it differs from
#     KOMET_RELEASE_PUBLIC_KEY.
#
# Third-party actions are pinned to commit SHAs; the comment names the
# release. Update both together.
#
# Trigger: push a tag `v<version>` matching the workspace version in
# Cargo.toml (bump it in the same commit), or run manually via
# workflow_dispatch (builds + uploads artifacts, no release publish).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  KOMET_RELEASE_PUBLIC_KEY: ${{ vars.KOMET_RELEASE_PUBLIC_KEY }}

jobs:
  # Binaries built without the public key cannot verify updates, so a tagged
  # release must never ship without it.
  signing-key:
    runs-on: ubuntu-latest
    steps:
      - name: check release public key
        run: |
          if printf '%s' "$KOMET_RELEASE_PUBLIC_KEY" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "release public key configured"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "vars.KOMET_RELEASE_PUBLIC_KEY is missing or not 64 lowercase hex characters"
            exit 1
          else
            echo "::warning::no release public key; these artifacts cannot verify updates"
          fi

  linux:
    needs: signing-key
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04 # x86_64 (maximum compatibility across Fedora, Debian, Ubuntu)
          - runner: ubuntu-24.04-arm # aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: gpui system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libfuse2 \
            python3-pil rpm
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: generate icons from master logo
        run: python3 scripts/gen-icons.py
      - name: package tarball
        run: scripts/package-linux.sh
      - name: package appimage
        if: matrix.runner == 'ubuntu-22.04'
        run: scripts/package-appimage.sh
      - name: package deb
        run: scripts/package-deb.sh
      - name: package rpm
        run: scripts/package-rpm.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ runner.arch }}
          path: |
            target/package/*.tar.gz
            target/package/*.AppImage
            target/package/*.deb
            target/package/*.rpm
          if-no-files-found: error

  # Heads-up: the macOS cfg paths (Keychain in agent_accounts.rs) have never
  # been type-checked against the Apple SDK — this job may surface errors on
  # its first runs. continue-on-error keeps the Linux release shippable.
  #
  # Signing/notarization (both optional — absent secrets fall back to an
  # ad-hoc-signed build):
  #   MACOS_CERT_P12 / MACOS_CERT_PASSWORD — base64 "Developer ID Application"
  #     certificate + private key (.p12) and its export password.
  #   AC_API_KEY_P8 / AC_API_KEY_ID / AC_API_ISSUER_ID — App Store Connect API
  #     key (raw .p8 contents), for notarytool. All three present → the package
  #     script notarizes and staples the app + dmg (no Gatekeeper warning).
  macos:
    needs: signing-key
    runs-on: macos-latest # Apple silicon
    continue-on-error: true
    # Signing secrets are passed only to the steps that use them, never to
    # the whole job, so build tools and third-party actions cannot read them.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: generate icons from master logo
        run: |
          python3 -m pip install --quiet --user pillow==12.3.0 2>/dev/null \
            || python3 -m pip install --quiet --user --break-system-packages pillow==12.3.0
          python3 scripts/gen-icons.py
      - name: detect signing secrets
        id: secrets-present
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: |
          echo "certificate=$([ -n "$MACOS_CERT_P12" ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          echo "notary=$([ -n "$AC_API_KEY_P8" ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
      - name: import Developer ID certificate
        if: steps.secrets-present.outputs.certificate == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          pass="$(openssl rand -hex 16)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 -d >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Allow codesign to use the imported key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "p12 contains no Developer ID Application identity"; exit 1; }
          echo "CODESIGN_IDENTITY=$identity" >>"$GITHUB_ENV"
      - name: notary credentials
        if: steps.secrets-present.outputs.notary == 'true'
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          printf '%s' "$AC_API_KEY_P8" >"$RUNNER_TEMP/ac_api_key.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/ac_api_key.p8"
            echo "NOTARY_KEY_ID=$AC_API_KEY_ID"
            echo "NOTARY_ISSUER_ID=$AC_API_ISSUER_ID"
          } >>"$GITHUB_ENV"
      - name: package dmg
        run: scripts/package-macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ runner.arch }}
          path: |
            target/package/*.dmg
            target/package/*.tar.gz
          if-no-files-found: error

  windows:
    needs: signing-key
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: package windows
        shell: bash
        run: scripts/package-windows.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ runner.arch }}
          path: |
            target/package/*.zip
            target/package/*.exe
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist-release
          merge-multiple: true
      - name: version guard (tag == artifact version)
        run: |
          ver="${GITHUB_REF_NAME#v}"
          ls -la dist-release/
          ls dist-release/ | grep -qi "komet[-_]$ver" \
            || { echo "tag v$ver does not match built artifact versions — bump Cargo.toml [workspace.package] version"; exit 1; }
          echo "VERSION=$ver" >> "$GITHUB_ENV"
      # manifest.json: version + per-artifact sha256 — the auto-updater
      # (crates/update) verifies downloads against it. Built before the release
      # so it ships as a release asset alongside the binaries.
      - name: build manifest.json
        run: |
          manifest=$(jq -n --arg version "$VERSION" '{version: $version, files: {}}')
          for f in dist-release/*; do
            [ -f "$f" ] || continue
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            manifest=$(jq --arg name "$(basename "$f")" --arg sha "$sha" \
              '.files[$name] = {sha256: $sha}' <<<"$manifest")
          done
          printf '%s\n' "$manifest" > dist-release/manifest.json
      # Detached Ed25519 signature over the exact manifest bytes. The key only
      # exists in this step, in a file readable by the runner user, and the
      # signature is checked against the public key before anything is uploaded.
      - name: sign manifest.json
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          KOMET_RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.KOMET_RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "secrets.RELEASE_SIGNING_KEY is not set"; exit 1; }
          umask 077
          key="$RUNNER_TEMP/release-signing-key.pem"
          printf '%s\n' "$RELEASE_SIGNING_KEY" >"$key"
          openssl pkeyutl -sign -rawin -inkey "$key" \
            -in dist-release/manifest.json -out dist-release/manifest.json.sig
          rm -f "$key"
          # The signature is checked against the key the manifest is signed
          # with. That is KOMET_RELEASE_PUBLIC_KEY, except in a rotation release
          # (see docs/release-signing.md), which declares the old key here.
          verify_key="${KOMET_RELEASE_SIGNING_PUBLIC_KEY:-$KOMET_RELEASE_PUBLIC_KEY}"
          # DER prefix of an Ed25519 SubjectPublicKeyInfo, then the raw key.
          printf '302a300506032b6570032100%s' "$verify_key" | xxd -r -p >"$RUNNER_TEMP/release-public-key.der"
          openssl pkeyutl -verify -rawin -pubin -keyform DER \
            -inkey "$RUNNER_TEMP/release-public-key.der" \
            -in dist-release/manifest.json -sigfile dist-release/manifest.json.sig
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist-release/*
          generate_release_notes: true
